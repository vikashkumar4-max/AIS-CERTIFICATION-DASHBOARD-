<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Pulse | Live Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #34d399;
            --warning: #fbbf24;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header UI */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-tag {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Search Bar UI */
        .search-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .search-card:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            color: var(--accent);
            font-size: 18px;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px 16px 50px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-sub);
        }

        /* Message Box */
        .placeholder-box {
            background: var(--card-bg);
            border: 1px dashed var(--border);
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-sub);
        }

        .placeholder-box svg {
            width: 48px;
            height: 48px;
            stroke: var(--accent);
            margin-bottom: 12px;
            opacity: 0.7;
        }

        /* Table UI */
        .table-card {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-sub);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .vehicle-tag {
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        /* Status Badges */
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(52, 211, 153, 0.12);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .badge-warning {
            background: rgba(251, 191, 36, 0.12);
            color: var(--warning);
            border: 1px solid rgba(251, 191, 36, 0.25);
        }

        .sync-footer {
            margin-top: 15px;
            text-align: right;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="brand-title">
                <h1>⚡ Fleet Pulse</h1>
            </div>
            <div class="live-tag">
                <div class="live-dot"></div>
                LIVE SYSTEM
            </div>
        </div>

        <!-- Search Box -->
        <div class="search-card">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" onkeyup="handleSearch()" placeholder="Search by Vehicle No, Owner Name, or Contact...">
            </div>
        </div>

        <!-- Default State (Empty) -->
        <div id="placeholder-box" class="placeholder-box">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
            </svg>
            <div>Enter details above to search live fleet data.</div>
        </div>

        <!-- Result Table -->
        <div id="table-card" class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Vehicle No</th>
                        <th>Permit Holder</th>
                        <th>Contact No</th>
                        <th>State</th>
                        <th>Status</th>
                        <th>Validity</th>
                    </tr>
                </thead>
                <tbody id="vehicle-data">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>

        <div class="sync-footer">
            Last Sync: <span id="sync-time">Syncing...</span>
        </div>
    </div>

    <script>
        // Paste your published Google Sheet CSV URL here
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSucNttQg7Lghr41JIAN7Ss-8zJTi6cQFi9KRn8mu3RSBRql9w9AdgkxiGMFR6J8gm2YQ8fxsJEIEM3/pub?gid=0&single=true&output=csv
"; 
        let allData = [];

        async function fetchVehicleData() {
            try {
                const response = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + "t=" + new Date().getTime());
                const csvText = await response.text();
                
                const rows = csvText.split('\n').map(row => {
                    return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
                });

                allData = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length < 5) continue;

                    allData.push({
                        dateVal: row[0] || '-',       
                        remarks: row[2] || '-',       
                        state: row[9] || '-',         
                        validity: row[10] || '-',     
                        vehicleNo: row[17] || '-',    
                        ownerName: row[20] || '-',    
                        contactNo: row[21] || '-'     
                    });
                }
                
                if (document.getElementById('search-input').value.trim().length >= 2) {
                    handleSearch();
                }

                document.getElementById('sync-time').innerText = new Date().toLocaleTimeString();
            } catch (error) {
                console.error("Data fetch error:", error);
            }
        }

        function handleSearch() {
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const tableCard = document.getElementById('table-card');
            const placeholderBox = document.getElementById('placeholder-box');

            if (searchVal.length < 2) { 
                tableCard.style.display = 'none';
                placeholderBox.style.display = 'block';
                placeholderBox.innerHTML = `
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
                    <div>Enter details above to search live fleet data.</div>
                `;
                return;
            }

            const filteredData = allData.filter(item => {
                return item.vehicleNo.toLowerCase().includes(searchVal) || 
                       item.ownerName.toLowerCase().includes(searchVal) ||
                       item.contactNo.includes(searchVal);
            });

            if (filteredData.length > 0) {
                tableCard.style.display = 'block';
                placeholderBox.style.display = 'none';
                renderTable(filteredData);
            } else {
                tableCard.style.display = 'none';
                placeholderBox.style.display = 'block';
                placeholderBox.innerHTML = `No vehicle records found for "<strong>${searchVal}</strong>".`;
            }
        }

        function renderTable(data) {
            const tableBody = document.getElementById('vehicle-data');
            tableBody.innerHTML = '';

            data.forEach(item => {
                const remarksLower = item.remarks.toLowerCase();
                let statusClass = 'badge-warning';
                if (remarksLower.includes('issued') || remarksLower.includes('done') || remarksLower.includes('success')) {
                    statusClass = 'badge-success';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: var(--text-sub);">${item.dateVal}</td>
                    <td><span class="vehicle-tag">${item.vehicleNo}</span></td>
                    <td>${item.ownerName}</td>
                    <td>${item.contactNo}</td>
                    <td>${item.state}</td>
                    <td><span class="badge ${statusClass}">${item.remarks}</span></td>
                    <td style="color: var(--text-sub);">${item.validity}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        fetchVehicleData();
        setInterval(fetchVehicleData, 60000); 
    </script>
</body>
</html>
