<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAA STATE LIVE DASHBOARD</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    :root {
      --bg-color: #eef2f6;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --navy-header: #111c3a;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; color: var(--text-main); padding: 24px; min-height: 100vh; }
    .container { max-width: 1300px; margin: 0 auto; }

    .top-header { background-color: var(--navy-header); color: white; padding: 20px 32px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px -5px rgba(17, 28, 58, 0.25); margin-bottom: 24px; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo-box { width: 48px; height: 48px; background: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .header-titles h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .header-titles p { font-size: 13px; color: #94a3b8; margin-top: 2px; font-weight: 500; }
    .header-titles p span { color: #cbd5e1; }
    .sync-badge { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .pulse-dot { width: 8px; height: 8px; background-color: #34d399; border-radius: 50%; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); animation: pulse 1.6s infinite; }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .kpi-card { background: var(--card-bg); border-radius: 16px; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03); border: 1px solid rgba(226, 232, 240, 0.8); }
    .kpi-info h3 { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
    .kpi-info .kpi-value { font-size: 30px; font-weight: 800; }
    .kpi-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

    .kpi-total .kpi-value { color: #0f172a; } .kpi-total .kpi-icon { background: #e0f2fe; color: #0284c7; }
    .kpi-issued .kpi-value { color: #10b981; } .kpi-issued .kpi-icon { background: #d1fae5; color: #10b981; }
    .kpi-pending .kpi-value { color: #ef4444; } .kpi-pending .kpi-icon { background: #fee2e2; color: #ef4444; }
    .kpi-action .kpi-value { color: #f59e0b; } .kpi-action .kpi-icon { background: #fef3c7; color: #d97706; }

    .main-card { background: var(--card-bg); border-radius: 20px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.03); border: 1px solid rgba(226, 232, 240, 0.8); }
    .filters-bar { display: flex; gap: 16px; margin-bottom: 24px; }
    .filter-select, .search-input-wrap { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: var(--text-main); font-weight: 500; outline: none; }
    .filter-select { min-width: 180px; cursor: pointer; }
    .search-input-wrap { flex: 1; display: flex; align-items: center; gap: 10px; color: #94a3b8; }
    .search-input-wrap input { border: none; background: transparent; width: 100%; outline: none; font-size: 14px; }

    .table-responsive { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
    td { padding: 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    
    .row-num { color: #64748b; font-weight: 700; }
    .vehicle-badge { display: inline-flex; align-items: center; gap: 8px; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .status-badge.issued { background: #ecfdf5; color: #059669; }
    .status-badge.warning { background: #fef3c7; color: #d97706; }
    .status-badge.danger { background: #fef2f2; color: #dc2626; }
    .btn-action { background: #ffffff; border: 1px solid var(--border-color); color: #475569; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }

    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal-card { background: white; border-radius: 20px; width: 90%; max-width: 600px; padding: 28px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .modal-body-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .detail-item { background: #f8fafc; padding: 12px 16px; border-radius: 12px; border: 1px solid #f1f5f9; }
    .detail-item label { font-size: 11px; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 4px; }
    .detail-item span { font-size: 14px; font-weight: 700; color: var(--navy-header); word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <header class="top-header">
      <div class="header-left">
        <div class="logo-box">🧩</div>
        <div class="header-titles">
          <h1>🚛 AAP STATE LIVE DASHBOARD</h1>
          <p>Managed by <span>MRATYUNJAY</span> • Real-time Sync ⚡</p>
        </div>
      </div>
      <div class="sync-badge"><span class="pulse-dot"></span> Live Sheet Sync</div>
    </header>

    <section class="kpi-grid">
      <div class="kpi-card kpi-total">
        <div class="kpi-info"><h3>TOTAL CASES 📁</h3><div class="kpi-value" id="kpi-total">0</div></div>
        <div class="kpi-icon"><i class="fa-solid fa-folder"></i></div>
      </div>
      <div class="kpi-card kpi-issued">
        <div class="kpi-info"><h3>CERTIFICATE ISSUED</h3><div class="kpi-value" id="kpi-issued">0</div></div>
        <div class="kpi-icon"><i class="fa-solid fa-circle-check"></i></div>
      </div>
      <div class="kpi-card kpi-pending">
        <div class="kpi-info"><h3>PENDING ⏳</h3><div class="kpi-value" id="kpi-pending">0</div></div>
        <div class="kpi-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      </div>
      <div class="kpi-card kpi-action">
        <div class="kpi-info"><h3>NEED ACTION 🛠️</h3><div class="kpi-value" id="kpi-action">0</div></div>
        <div class="kpi-icon"><i class="fa-solid fa-bolt"></i></div>
      </div>
    </section>

    <main class="main-card">
      <div class="filters-bar">
        <select class="filter-select" id="stateFilter"><option value="ALL">All States 🗺️</option></select>
        <select class="filter-select" id="statusFilter"><option value="ALL">All Status / Remarks</option></select>
        <div class="search-input-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search Vehicle, Owner, State, IMEI...">
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>VEHICLE NO. / RTO</th>
              <th>STATUS</th>
              <th>OWNER / COMPANY</th>
              <th>ACTION</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalVehicleNo">Vehicle Details</h2>
        <button style="border:none; background:none; font-size:20px; cursor:pointer;" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body-grid" id="modalGrid"></div>
    </div>
  </div>

  <script>
    // PEHLE GOOGLE SHEET KO PUBLISH TO WEB (CSV) KAREIN AUR WOH LINK YAHAN REPLACE KAREIN
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSucNttQg7Lghr41JIAN7Ss-8zJTi6cQFi9KRn8mu3RSBRql9w9AdgkxiGMFR6J8gm2YQ8fxsJEIEM3/pub?gid=0&single=true&output=csv
';

    let allData = [];

    function loadData() {
      if (SHEET_CSV_URL === 'YOUR_PUBLISHED_CSV_URL_HERE') {
        alert("https://docs.google.com/spreadsheets/d/e/2PACX-1vSucNttQg7Lghr41JIAN7Ss-8zJTi6cQFi9KRn8mu3RSBRql9w9AdgkxiGMFR6J8gm2YQ8fxsJEIEM3/pub?gid=0&single=true&output=csv
");
        return;
      }

      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allData = results.data;
          initDashboard();
        }
      });
    }

    function initDashboard() {
      populateDropdowns();
      renderKPIs(allData);
      renderTable(allData);

      document.getElementById('stateFilter').addEventListener('change', filterData);
      document.getElementById('statusFilter').addEventListener('change', filterData);
      document.getElementById('searchInput').addEventListener('input', filterData);
    }

    function populateDropdowns() {
      const stateSelect = document.getElementById('stateFilter');
      const statusSelect = document.getElementById('statusFilter');

      const states = [...new Set(allData.map(d => d.STATE || d.State).filter(Boolean))];
      const statuses = [...new Set(allData.map(d => d.Remarks || d.STATUS || d.Status).filter(Boolean))];

      states.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st; opt.textContent = st;
        stateSelect.appendChild(opt);
      });

      statuses.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st; opt.textContent = st;
        statusSelect.appendChild(opt);
      });
    }

    function renderKPIs(data) {
      let issued = 0, pending = 0, needAction = 0;

      data.forEach(row => {
        const remark = (row.Remarks || row.Status || '').toLowerCase();
        if (remark.includes('certificate issued') || remark.includes('issued')) {
          issued++;
        } else if (remark.includes('pending') || remark.includes('tagged by another')) {
          pending++;
        } else {
          needAction++;
        }
      });

      document.getElementById('kpi-total').textContent = data.length;
      document.getElementById('kpi-issued').textContent = issued;
      document.getElementById('kpi-pending').textContent = pending;
      document.getElementById('kpi-action').textContent = needAction;
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">No data found</td></tr>`;
        return;
      }

      data.forEach((row, index) => {
        const tr = document.createElement('tr');
        const vehicleNo = row['VEHICLE NO'] || row['Vehicle No'] || row['RTO CODE'] || row['IMEI'] || 'N/A';
        const remark = row['Remarks'] || row['Status'] || 'N/A';
        const owner = row['OWNER'] || row['Owner'] || 'N/A';

        let badgeClass = 'issued';
        let icon = '<i class="fa-solid fa-check"></i>';
        const remLower = remark.toLowerCase();

        if (remLower.includes('mins device') || remLower.includes('not live')) {
          badgeClass = 'warning';
          icon = '<i class="fa-solid fa-bolt"></i>';
        } else if (remLower.includes('another franchsi') || remLower.includes('pending')) {
          badgeClass = 'danger';
          icon = '<i class="fa-solid fa-triangle-exclamation"></i>';
        }

        tr.innerHTML = `
          <td class="row-num">${index + 1}</td>
          <td><span class="vehicle-badge"><i class="fa-solid fa-bus"></i> ${vehicleNo}</span></td>
          <td><span class="status-badge ${badgeClass}">${icon} ${remark}</span></td>
          <td>${owner}</td>
          <td><button class="btn-action" onclick="openModal(${index})"><i class="fa-regular fa-eye"></i> View All</button></td>
        `;

        tbody.appendChild(tr);
      });
    }

    function filterData() {
      const selectedState = document.getElementById('stateFilter').value;
      const selectedStatus = document.getElementById('statusFilter').value;
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allData.filter(row => {
        const state = (row.STATE || row.State || '');
        const remark = (row.Remarks || row.Status || '');
        const fullText = Object.values(row).join(' ').toLowerCase();

        const matchState = selectedState === 'ALL' || state === selectedState;
        const matchStatus = selectedStatus === 'ALL' || remark === selectedStatus;
        const matchSearch = fullText.includes(searchQuery);

        return matchState && matchStatus && matchSearch;
      });

      renderKPIs(filtered);
      renderTable(filtered);
    }

    function openModal(index) {
      const row = allData[index];
      const vehicleNo = row['VEHICLE NO'] || row['Vehicle No'] || row['RTO CODE'] || 'Vehicle Details';
      
      document.getElementById('modalVehicleNo').textContent = vehicleNo;
      const modalGrid = document.getElementById('modalGrid');
      modalGrid.innerHTML = '';

      Object.keys(row).forEach(key => {
        const item = document.createElement('div');
        item.className = 'detail-item';
        item.innerHTML = `<label>${key}</label><span>${row[key] || 'N/A'}</span>`;
        modalGrid.appendChild(item);
      });

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    loadData();
  </script>
</body>
</html>
