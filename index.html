<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Vehicle Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f6f9; }
        .dashboard-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a252f; }
        .sync-info { font-size: 14px; color: #6c757d; margin-bottom: 15px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { background-color: #007bff; color: white; padding: 12px; text-align: left; }
        td { border-bottom: 1px solid #e9ecef; padding: 10px; color: #333; }
        tr:hover { background-color: #f8f9fa; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-success { background-color: #d4edda; color: #155724; }
        .badge-warning { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h2>🚚 Live Vehicle Dashboard</h2>
        <div class="sync-info">Last Sync: <strong id="sync-time">Fetching...</strong></div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Vehicle No</th>
                        <th>Permit Holder</th>
                        <th>Contact No</th>
                        <th>State</th>
                        <th>Remarks / Status</th>
                        <th>Current Validity</th>
                    </tr>
                </thead>
                <tbody id="vehicle-data">
                    <tr><td colspan="7">Loading live sheet data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Step 1 से प्राप्त अपनी Google Sheet की CSV URL को यहाँ पेस्ट करें:
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSucNttQg7Lghr41JIAN7Ss-8zJTi6cQFi9KRn8mu3RSBRql9w9AdgkxiGMFR6J8gm2YQ8fxsJEIEM3/pub?gid=0&single=true&output=csv";

        async function fetchVehicleData() {
            try {
                // Cache bypass करने के लिए timestamp जोड़ा गया है
                const response = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + "t=" + new Date().getTime());
                const csvText = await response.text();
                
                // CSV Parsing Logic
                const rows = csvText.split('\n').map(row => {
                    return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
                });

                const tableBody = document.getElementById('vehicle-data');
                tableBody.innerHTML = '';

                // Headers (Row 0) छोड़कर Row 1 से Render करें
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length < 5) continue; // Empty row filter

                    // Master Sheet Column Index Mapping
                    const dateVal = row[0] || '-';          // Col A: DATE
                    const remarks = row[2] || '-';          // Col C: Remarks
                    const state = row[9] || '-';            // Col J: STATE
                    const validity = row[10] || '-';        // Col K: Current Validity
                    const vehicleNo = row[17] || '-';       // Col R: Vehicle no.
                    const ownerName = row[20] || '-';       // Col U: permit holder name
                    const contactNo = row[21] || '-';       // Col V: contact no.

                    const statusClass = remarks.toLowerCase().includes('issued') ? 'badge-success' : 'badge-warning';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${dateVal}</td>
                        <td><strong>${vehicleNo}</strong></td>
                        <td>${ownerName}</td>
                        <td>${contactNo}</td>
                        <td>${state}</td>
                        <td><span class="badge ${statusClass}">${remarks}</span></td>
                        <td>${validity}</td>
                    `;
                    tableBody.appendChild(tr);
                }

                document.getElementById('sync-time').innerText = new Date().toLocaleTimeString();
            } catch (error) {
                console.error("Data fetch error:", error);
                document.getElementById('vehicle-data').innerHTML = `<tr><td colspan="7" style="color:red;">Failed to load data. Please check CSV URL.</td></tr>`;
            }
        }

        // initial call
        fetchVehicleData();

        // Har 10 seconds mein auto update
        setInterval(fetchVehicleData, 10000);
    </script>
</body>
</html>
